# TaintWalk default configuration.
# Paths may use ~ and $VARS. $GHIDRA_INSTALL_DIR, if set, overrides ghidra.install_dir.
# Relative paths are relative to the repo root.

ghidra:
  install_dir: ~/opt/ghidra_12.1.4_PUBLIC
  expected_version: "12.1.4"

toolchain:
  min_python: "3.11"
  java_major: 21

smoke:
  out_dir: runs/p0-smoke
  cflags: ["-g", "-O0", "-fno-inline"]

# Phase 1 corpus (D-011 scope, D-013 selection, D-014 hardening).
corpus:
  juliet_root: corpus/juliet/C          # Juliet C/C++ 1.3, SHA-256 ada9d7e1...38eb
  build_dir: corpus/build
  manifest: corpus/manifest.json
  seed: 20260925
  total: 240
  per_cell: 2                           # 13 x 9 = 117 cells -> 234, +6 seeded extras
  cwes: [78, 121, 122, 124, 126, 127, 134, 190, 191, 369, 606, 680, 789]
  flows: ["01", "31", "41", "42", "44", "45", "52", "54", "63"]
  control_flows: ["01", "31"]           # single-function controls
  # A functional variant is "external" if its name contains any of these.
  external_sources: ["fgets", "fscanf", "listen_socket", "connect_socket",
                     "rand", "environment", "file", "console"]
  # Buffer classes: each cell = 1 external (index sink) + 1 fixed call/loop-sink case.
  stratified_cwes: [121, 122, 124, 126, 127]
  fixed_call_tokens: ["memcpy", "memmove", "ncpy", "cpy", "ncat", "cat"]
  fixed_loop_tokens: ["loop"]
  support_sources: ["io.c"]             # compiled into every binary; its functions are never labels
  cflags: ["-g", "-O0", "-fno-inline",
           "-fstack-protector-strong", "-fcf-protection=full",
           "-fPIE", "-pie", "-U_FORTIFY_SOURCE",
           "-DINCLUDEMAIN"]
  jobs: 16

# Phase 2 extraction (D-015: structural, label-free scoping).
extract:
  out_dir: runs/p2-extract              # default for `extract --all`
  smoke_dir: runs/p2-smoke              # default for single-binary extract
  decompile_timeout_s: 60               # per function, passed to DecompInterface
  binary_timeout_s: 300                 # wall clock for one export subprocess
  jobs: 8                               # one JVM per job; ~1-2 GB each, 15 GiB available
  min_recovery: 0.80                    # Phase 2 gate threshold
  # Blocks whose functions are candidates for analysis. Everything else is excluded.
  text_blocks: [".text"]
  plt_blocks: [".plt", ".plt.sec", ".plt.got"]

# Phase 6 walk (D-026).
walk:
  out_dir: runs/p6-walk                 # default --run-dir for `taintwalk walk`
  callee_context_max_chars: 12000       # test: system + user + this cap <= 28,544-char preflight budget
  scc_max_iterations: 3                 # fixed-point cap for recursive components

# Phase 9 real-code corpus (D-009). Ground truth: read by the eval side and the leak gate only.
real:
  manifest: corpus/real/manifest.json

# Phase 10 agentic mode (D-042). Hard caps; values are fixed at the freeze tag p10-freeze.
agent:
  max_actions: 8                        # agent steps per root, finish included
  max_calls: 20                         # model calls per root: steps, callee summaries and the judge
  max_tokens_per_root: 150000           # metered: ceil(chars / token_chars_ratio) of every prompt and reply
  max_tokens_per_run: 18000000             # frozen 2026-10-13: 2 x the larger dev projection (D-042)
  read_code_max_chars: 4000             # read_code result cap, cut at whole lines
  evidence_max_chars: 12000             # = walk.callee_context_max_chars, so the judge prompt fits (D-026 test)
  token_chars_ratio: 2.0                # the Ollama preflight's chars-per-token floor (D-019)
