[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taintwalk"
version = "0.0.1"
description = "LLM-driven interprocedural taint analysis over stripped ELF binaries"
requires-python = ">=3.11"
# pyghidra is intentionally NOT listed: it is installed from the wheel bundled
# inside the pinned Ghidra install, so its Python side matches Ghidra's Java side.
dependencies = [
    "pyyaml>=6",
    "pyelftools>=0.31",
    "pydantic>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
taintwalk = "taintwalk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"